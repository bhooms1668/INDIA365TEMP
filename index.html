<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeritageVerse</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{

margin:0;

font-family:Georgia,serif;

background:
linear-gradient(rgba(50,0,0,.55),
rgba(50,0,0,.75)),

url("https://images.unsplash.com/photo-1524492412937-b28074a5d7da?q=80&w=1800");

background-size:cover;

background-position:center;

min-height:100vh;

overflow:hidden;

color:white;

}

nav{

display:flex;

justify-content:space-between;

padding:30px 70px;

z-index:2;

position:relative;

}

.logo{

font-size:34px;

font-weight:bold;

color:#f5d28a;

}

.menu a{

margin-left:30px;

color:#f5d28a;

text-decoration:none;

font-size:18px;

}

.hero{

text-align:center;

margin-top:60px;

position:relative;

}

.hero h1{

font-size:90px;

color:#f5d28a;

margin-bottom:10px;

}

.hero p{

font-size:28px;

color:#fff0c9;

}

.cards{

display:flex;

justify-content:center;

gap:35px;

flex-wrap:wrap;

margin-top:70px;

}

.card{

width:240px;

height:240px;

padding:30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(10px);

border-radius:25px;

border:1px solid rgba(255,215,0,.3);

color:white;

text-decoration:none;

transition:.4s;

}

.card:hover{

transform:translateY(-10px);

box-shadow:0 0 25px gold;

}

.icon{

font-size:45px;

margin-bottom:20px;

}

.card h2{

color:#f5d28a;

}

<body>

<div class="overlay"></div>

<nav>
    <div class="logo">HeritageVerse</div>

    <div class="menu">
        <a href="#">नमस्ते</a>
    </div>
</nav>

<section class="hero">

<div class="top-design">✦ ✦ ✦</div>

<h1>INDIA365</h1>

<p>AI Powered Cultural Heritage Platform</p>

<div class="cards" id="features">

<a class="card"
href="https://heritageverse.onrender.com/monument">

<div class="icon">🏛️</div>
<h2>Monument AI</h2>
<p>Identify monuments instantly using AI vision.</p>

</a>


<a class="card"
href="https://heritageverse.onrender.com/translator">

<div class="icon">🎙️</div>
<h2>Voice Translator</h2>
<p>Translate heritage content into Indian languages.</p>

</a>


<a class="card"
href="https://heritageverse.onrender.com/photobooth">

<div class="icon">📸</div>
<h2>CulturaCam</h2>
<p>Create heritage themed photos instantly.</p>

</a>


<a class="card"
href="https://heritageverse.onrender.com/map">

<div class="icon">🗺️</div>
<h2>Heritage Map</h2>
<p>Explore monuments on an interactive cultural map.</p>

</a>

</div>

</section>

</body>
</html>
